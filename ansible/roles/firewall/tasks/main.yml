---

- name: Install UFW
  apt:
    name: ufw
    state: present

- name: Set UFW default deny incoming
  ufw:
    policy: deny
    direction: incoming

- name: Set UFW deafault allow outgoing
  ufw:
    policy: allow
    direction: outgoing

- name: Allow Tailscale UDP ports
  ufw:
    rule: allow
    proto: udp
    port: '41641'

- name: Allow traffic on the Tailscale interface
  ufw:
    rule: allow
    interface_in: tailscale0

- name: Enable UFW
  ufw:
    state: enabled
